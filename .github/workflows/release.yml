name: Release

# Push a tag like v0.1.0 to build the installer and attach it to a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Beacon ${{ github.ref_name }}
          releaseBody: |
            Windows installer for Beacon. This build is not code-signed, so Windows
            SmartScreen may warn on first launch ("More info" > "Run anyway").
          releaseDraft: true
          prerelease: true
