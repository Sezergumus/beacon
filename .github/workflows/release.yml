name: Release

# Push a tag like v0.1.0 to build Beacon.exe and attach it to a draft GitHub release.
# There is no installer: Beacon.exe runs on its own, from any folder.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --no-bundle skips the installer step and only builds the program itself.
      - name: Build
        run: npm run tauri -- build --no-bundle

      - name: Name the file
        run: Copy-Item src-tauri/target/release/beacon.exe Beacon.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Beacon ${{ github.ref_name }}
          # Stays a draft so you can test Beacon.exe before publishing. It is not marked as a
          # pre-release: GitHub's "latest release" link (used by the site and README) skips those.
          draft: true
          prerelease: false
          files: Beacon.exe
          body: |
            Download **Beacon.exe** and double-click it. There is nothing to install.

            This build is not code-signed, so Windows SmartScreen may warn on first launch
            ("More info" > "Run anyway").
